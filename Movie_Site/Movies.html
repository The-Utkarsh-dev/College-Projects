<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineSearch | Movie Search and Recommendation</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <h2 class="logo">CineSearch</h2>
        <nav>
            <a href="#home">Home</a>
            <a href="#movies">Movies</a>
            <a href="#favourites">Favourites</a>
            <a href="#recommended">Recommended</a>
        </nav>
    </header>

    <section id="home" class="hero">
        <h1>Find your next movie</h1>
        <p>Search by name, pick a genre, save the ones you like and get recommendations.</p>
        <input type="text" id="searchBox" placeholder="Search movies...">
    </section>

    <section id="movies">
        <h2>All Movies</h2>
        <div class="genres" id="genreButtons">
            <button class="genre active" onclick="setGenre('All')">All</button>
            <button class="genre" onclick="setGenre('Action')">Action</button>
            <button class="genre" onclick="setGenre('Sci-Fi')">Sci-Fi</button>
            <button class="genre" onclick="setGenre('Animation')">Animation</button>
            <button class="genre" onclick="setGenre('Drama')">Drama</button>
            <button class="genre" onclick="setGenre('Comedy')">Comedy</button>
            <button class="genre" onclick="setGenre('Thriller')">Thriller</button>
            <button class="genre" onclick="setGenre('Crime')">Crime</button>
        </div>
        <p id="noResult"></p>
        <div class="grid" id="movieGrid"></div>
    </section>

    <section id="favourites">
        <h2>My Favourites</h2>
        <p id="favMessage"></p>
        <div class="grid" id="favGrid"></div>
    </section>

    <section id="recommended">
        <h2>Recommended for you</h2>
        <p id="recMessage"></p>
        <div class="grid" id="recGrid"></div>
    </section>

    <footer>
        <p>Made by Utkarsh | Sample movie data, posters are placeholders</p>
    </footer>

    <a href="#favourites" id="favBtn">♥ Favourites (<span id="favCount">0</span>)</a>

    <script src="script.js"></script>
</body>
</html>
